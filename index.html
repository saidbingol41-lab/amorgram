<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Amorgram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    .story-ring { background: linear-gradient(45deg, #7c3aed, #ec4899, #f43f5e); padding: 2.5px; border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-nav { background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex justify-center">

  <div id="auth-screen" class="w-full max-w-[400px] min-h-screen flex flex-col justify-center px-6 py-8">
    <div class="border border-zinc-800 bg-zinc-950/60 rounded-xl p-8 flex flex-col items-center">
      <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-purple-400 via-pink-500 to-rose-500 bg-clip-text text-transparent mb-6">amorgram</h1>

      <form id="login-form" class="w-full space-y-3">
        <input type="text" id="login-identifier" placeholder="Kullanıcı adı veya e-posta" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-pink-500" />
        <input type="password" id="login-password" placeholder="Şifre" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-pink-500" />
        <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 font-semibold text-sm py-2.5 rounded-lg transition">Giriş Yap</button>
      </form>

      <form id="register-form" class="w-full space-y-3 hidden">
        <input type="email" id="reg-email" placeholder="E-posta adresi" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-pink-500" />
        <input type="text" id="reg-fullname" placeholder="Ad Soyad" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-pink-500" />
        <input type="text" id="reg-username" placeholder="Kullanıcı adı" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-pink-500" />
        <input type="password" id="reg-password" placeholder="Şifre (en az 6 karakter)" minlength="6" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-pink-500" />
        <button type="submit" id="reg-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 font-semibold text-sm py-2.5 rounded-lg transition">Kaydol</button>
      </form>

      <div id="auth-message" class="mt-4 text-xs text-center hidden p-3 rounded-lg w-full"></div>
    </div>

    <div class="border border-zinc-800 bg-zinc-950/60 rounded-xl p-4 mt-3 text-center text-sm">
      <span id="auth-switch-text" class="text-zinc-400">Hesabın yok mu?</span>
      <button id="auth-switch-btn" class="text-pink-500 font-semibold ml-1">Kaydol</button>
    </div>
  </div>

  <div id="app-screen" class="w-full max-w-[470px] min-h-screen border-x border-zinc-900 hidden flex-col pb-16 relative">
    <header class="sticky top-0 z-30 glass-nav border-b border-zinc-900 px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('feed')">
        <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">amorgram</span>
      </div>
      <div class="flex items-center gap-5 text-xl">
        <button onclick="openModal('story-modal')" title="Hikaye Ekle" class="hover:text-pink-500 transition"><i class="fa-regular fa-square-plus"></i></button>
        <button onclick="switchTab('dm')" class="relative hover:text-pink-500 transition">
          <i class="fa-regular fa-paper-plane"></i>
          <span id="dm-badge" class="hidden absolute -top-1 -right-1.5 w-2.5 h-2.5 bg-pink-500 rounded-full"></span>
        </button>
      </div>
    </header>

    <main id="tab-feed" class="flex-1">
      <div id="stories-bar" class="flex items-center gap-3.5 px-4 py-3 border-b border-zinc-900 overflow-x-auto no-scrollbar"></div>
      <div id="posts-feed" class="divide-y divide-zinc-900"></div>
    </main>

    <main id="tab-search" class="flex-1 hidden p-4">
      <div class="relative mb-4">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-zinc-500 text-sm"></i>
        <input type="text" id="search-input" oninput="searchUsers(this.value)" placeholder="Kullanıcı adı ara..." class="w-full bg-zinc-900 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-pink-500" />
      </div>
      <div id="search-results" class="space-y-3"></div>
    </main>

    <main id="tab-dm" class="flex-1 hidden flex-col h-[calc(100vh-7rem)]">
      <div id="dm-list-view" class="p-4 space-y-3 overflow-y-auto flex-1">
        <h2 class="font-bold text-base mb-2">Mesajlar</h2>
        <div id="dm-users-list" class="space-y-2"></div>
      </div>

      <div id="dm-chat-view" class="hidden flex-col h-full">
        <div class="flex items-center gap-3 px-4 py-2.5 border-b border-zinc-900 bg-zinc-950">
          <button onclick="closeChat()" class="text-lg pr-1"><i class="fa-solid fa-arrow-left"></i></button>
          <img id="chat-user-avatar" src="" class="w-8 h-8 rounded-full object-cover" />
          <div>
            <div id="chat-user-name" class="text-sm font-semibold leading-tight"></div>
            <div class="text-[11px] text-emerald-400">Çevrimiçi</div>
          </div>
        </div>
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-2.5 flex flex-col"></div>
        <form id="chat-form" class="p-3 border-t border-zinc-900 flex items-center gap-2 bg-black">
          <input type="text" id="chat-input" placeholder="Mesaj yaz..." autocomplete="off" class="flex-1 bg-zinc-900 rounded-full px-4 py-2 text-sm focus:outline-none" />
          <button type="submit" class="text-pink-500 font-semibold text-sm px-3">Gönder</button>
        </form>
      </div>
    </main>

    <main id="tab-profile" class="flex-1 hidden">
      <div class="p-4">
        <div class="flex items-center justify-between mb-4">
          <h2 id="prof-header-username" class="text-lg font-bold"></h2>
          <button onclick="logout()" class="text-xs bg-zinc-900 hover:bg-red-950 text-red-400 px-3 py-1.5 rounded-lg border border-zinc-800">Çıkış Yap</button>
        </div>
        <div class="flex items-center gap-6 mb-4">
          <img id="prof-avatar" src="" class="w-20 h-20 rounded-full object-cover border-2 border-pink-500 p-0.5" />
          <div class="flex gap-6 text-center flex-1 justify-around">
            <div><div id="prof-post-count" class="font-bold text-lg">0</div><div class="text-xs text-zinc-400">Gönderi</div></div>
            <div><div class="font-bold text-lg">1.4B</div><div class="text-xs text-zinc-400">Takipçi</div></div>
            <div><div class="font-bold text-lg">312</div><div class="text-xs text-zinc-400">Takip</div></div>
          </div>
        </div>
        <div class="mb-4">
          <div id="prof-fullname" class="font-semibold text-sm"></div>
          <p id="prof-bio" class="text-sm text-zinc-300 mt-0.5 whitespace-pre-line"></p>
        </div>
        <button onclick="openEditProfile()" class="w-full bg-zinc-900 hover:bg-zinc-800 text-sm font-semibold py-1.5 rounded-lg border border-zinc-800 transition">Profili Düzenle</button>
      </div>
      <div class="border-t border-zinc-900 grid grid-cols-3 gap-0.5" id="prof-posts-grid"></div>
    </main>

    <nav class="fixed bottom-0 w-full max-w-[470px] glass-nav border-t border-zinc-900 h-14 flex items-center justify-around text-xl z-30">
      <button onclick="switchTab('feed')" class="nav-btn text-white" data-tab="feed"><i class="fa-solid fa-house"></i></button>
      <button onclick="switchTab('search')" class="nav-btn text-zinc-500" data-tab="search"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button onclick="openModal('post-modal')" class="text-zinc-300 hover:text-pink-500"><i class="fa-regular fa-square-plus text-2xl"></i></button>
      <button onclick="switchTab('dm')" class="nav-btn text-zinc-500" data-tab="dm"><i class="fa-regular fa-comment-dots"></i></button>
      <button onclick="switchTab('profile')" class="nav-btn text-zinc-500" data-tab="profile">
        <img id="nav-avatar" src="" class="w-6 h-6 rounded-full object-cover border border-zinc-600" />
      </button>
    </nav>
  </div>

  <div id="post-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
    <div class="bg-zinc-950 border border-zinc-800 rounded-2xl w-full max-w-sm p-5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold">Yeni Gönderi</h3>
        <button onclick="closeModal('post-modal')" class="text-zinc-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="new-post-form" class="space-y-3">
        <input type="file" id="post-file" accept="image/*" required class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-pink-600 file:text-white" />
        <textarea id="post-caption" rows="3" placeholder="Açıklama yaz..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none"></textarea>
        <button type="submit" id="post-submit-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-2.5 rounded-lg font-semibold text-sm">Paylaş</button>
      </form>
    </div>
  </div>

  <div id="story-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
    <div class="bg-zinc-950 border border-zinc-800 rounded-2xl w-full max-w-sm p-5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold">Hikayene Ekle (24 Saat)</h3>
        <button onclick="closeModal('story-modal')" class="text-zinc-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="new-story-form" class="space-y-3">
        <input type="file" id="story-file" accept="image/*" required class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-purple-600 file:text-white" />
        <button type="submit" id="story-submit-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-2.5 rounded-lg font-semibold text-sm">Hikayeyi Paylaş</button>
      </form>
    </div>
  </div>

  <div id="story-viewer" class="fixed inset-0 bg-black z-50 hidden flex-col">
    <div class="w-full bg-zinc-800 h-1"><div id="story-progress" class="bg-pink-500 h-1 w-0 transition-all duration-[5000ms] linear"></div></div>
    <div class="flex items-center justify-between p-4 bg-gradient-to-b from-black/80 to-transparent z-10">
      <div class="flex items-center gap-2.5">
        <img id="sv-avatar" src="" class="w-8 h-8 rounded-full object-cover" />
        <span id="sv-username" class="font-semibold text-sm"></span>
      </div>
      <button onclick="closeStoryViewer()" class="text-xl"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="flex-1 flex items-center justify-center overflow-hidden">
      <img id="sv-image" src="" class="max-h-full max-w-full object-contain" />
    </div>
  </div>

  <div id="comments-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-end sm:items-center justify-center">
    <div class="bg-zinc-950 border border-zinc-800 rounded-t-2xl sm:rounded-2xl w-full max-w-md h-[70vh] flex flex-col">
      <div class="flex justify-between items-center p-4 border-b border-zinc-900">
        <h3 class="font-bold text-sm">Yorumlar</h3>
        <button onclick="closeModal('comments-modal')" class="text-zinc-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="comments-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <form id="new-comment-form" class="p-3 border-t border-zinc-900 flex gap-2">
        <input type="text" id="comment-input" placeholder="Yorum ekle..." required class="flex-1 bg-zinc-900 rounded-full px-4 py-2 text-sm focus:outline-none" />
        <button type="submit" class="text-pink-500 font-semibold text-sm px-2">Paylaş</button>
      </form>
    </div>
  </div>

  <div id="edit-profile-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
    <div class="bg-zinc-950 border border-zinc-800 rounded-2xl w-full max-w-sm p-5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold">Profili Düzenle</h3>
        <button onclick="closeModal('edit-profile-modal')" class="text-zinc-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="edit-profile-form" class="space-y-3">
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Profil Fotoğrafı Değiştir</label>
          <input type="file" id="edit-avatar-file" accept="image/*" class="w-full text-xs text-zinc-400" />
        </div>
        <input type="text" id="edit-fullname" placeholder="Ad Soyad" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-sm" />
        <textarea id="edit-bio" rows="3" placeholder="Biyografi" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5 text-sm"></textarea>
        <button type="submit" class="w-full bg-pink-600 py-2.5 rounded-lg font-semibold text-sm">Kaydet</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://adjdkirrrhmdqsppzpch.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_hAgjzDnE0X42tzIBMyiU9A_T-MfkCqH';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    let activeChatUser = null;
    let activePostIdForComments = null;
    let storyTimer = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) {
        initApp(session.user);
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
      }

      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session?.user) {
          initApp(session.user);
        } else if (event === 'SIGNED_OUT') {
          location.reload();
        }
      });
    });

    let isRegisterMode = false;
    document.getElementById('auth-switch-btn').addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      document.getElementById('login-form').classList.toggle('hidden', isRegisterMode);
      document.getElementById('register-form').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('auth-switch-text').textContent = isRegisterMode ? 'Zaten hesabın var mı?' : 'Hesabın yok mu?';
      document.getElementById('auth-switch-btn').textContent = isRegisterMode ? 'Giriş Yap' : 'Kaydol';
      document.getElementById('auth-message').classList.add('hidden');
    });

    function showAuthMsg(msg, isError = true) {
      const el = document.getElementById('auth-message');
      el.textContent = msg;
      el.className = `mt-4 text-xs text-center p-3 rounded-lg w-full ${isError ? 'bg-red-950/80 text-red-300 border border-red-800' : 'bg-emerald-950/80 text-emerald-300 border border-emerald-800'}`;
      el.classList.remove('hidden');
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reg-email').value.trim();
      const fullName = document.getElementById('reg-fullname').value.trim();
      const username = document.getElementById('reg-username').value.trim().toLowerCase().replace(/[^a-z0-9_.]/g, '');
      const password = document.getElementById('reg-password').value;

      const { data: existing } = await sb.from('profiles').select('id').eq('username', username).maybeSingle();
      if (existing) return showAuthMsg('Bu kullanıcı adı zaten alınmış!');

      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.origin,
          data: { username, full_name: fullName }
        }
      });

      if (error) return showAuthMsg(error.message);
      if (data.session && data.user) {
        initApp(data.user);
      } else {
        showAuthMsg('Kayıt başarılı! E-posta doğrulama açıksa mailindeki bağlantıya tıkla, ardından giriş yap.', false);
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      let identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;

      if (!identifier.includes('@')) {
        const { data: prof } = await sb.from('profiles').select('email').eq('username', identifier.toLowerCase()).maybeSingle();
        if (!prof) return showAuthMsg('Bu kullanıcı adına ait hesap bulunamadı.');
        identifier = prof.email;
      }

      const { data, error } = await sb.auth.signInWithPassword({ email: identifier, password });
      if (error) return showAuthMsg('Kullanıcı adı/şifre hatalı veya mail adresin henüz doğrulanmamış!');
      initApp(data.user);
    });

    async function logout() { await sb.auth.signOut(); }

    async function initApp(user) {
      currentUser = user;
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('app-screen').classList.add('flex');

      const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      currentProfile = profile || {
        id: user.id,
        email: user.email,
        username: user.email.split('@')[0],
        full_name: '',
        avatar_url: 'https://placehold.co/150x150/18181b/ec4899?text=A',
        bio: ''
      };
      document.getElementById('nav-avatar').src = currentProfile.avatar_url;

      loadStories();
      loadFeed();
      loadDMUsers();
      subscribeRealtime();
    }

    function switchTab(tab) {
      ['feed', 'search', 'dm', 'profile'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
      });
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('text-white', btn.dataset.tab === tab);
        btn.classList.toggle('text-zinc-500', btn.dataset.tab !== tab);
      });
      if (tab === 'profile') loadMyProfile();
      if (tab === 'dm') { closeChat(); loadDMUsers(); }
      if (tab === 'search') searchUsers('');
    }

    async function uploadImage(file, folder) {
      const ext = file.name.split('.').pop();
      const fileName = `${folder}/${currentUser.id}_${Date.now()}.${ext}`;
      const { error } = await sb.storage.from('media').upload(fileName, file);
      if (error) throw error;
      const { data } = sb.storage.from('media').getPublicUrl(fileName);
      return data.publicUrl;
    }

    async function loadStories() {
      const { data: stories } = await sb
        .from('stories')
        .select('*, profiles(username, avatar_url)')
        .gt('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false });

      const bar = document.getElementById('stories-bar');
      bar.innerHTML = `
        <div onclick="openModal('story-modal')" class="flex flex-col items-center gap-1 cursor-pointer shrink-0">
          <div class="relative">
            <img src="${currentProfile.avatar_url}" class="w-16 h-16 rounded-full object-cover border border-zinc-800" />
            <div class="absolute bottom-0 right-0 bg-pink-600 w-5 h-5 rounded-full flex items-center justify-center text-xs border-2 border-black"><i class="fa-solid fa-plus"></i></div>
          </div>
          <span class="text-[11px] text-zinc-400">Hikayen</span>
        </div>
      `;

      const seenUsers = new Set();
      (stories || []).forEach(st => {
        if (seenUsers.has(st.user_id)) return;
        seenUsers.add(st.user_id);
        const div = document.createElement('div');
        div.className = 'flex flex-col items-center gap-1 cursor-pointer shrink-0';
        div.onclick = () => viewStory(st);
        div.innerHTML = `
          <div class="story-ring"><img src="${st.profiles.avatar_url}" class="w-[60px] h-[60px] rounded-full object-cover border-2 border-black" /></div>
          <span class="text-[11px] text-zinc-200 max-w-[66px] truncate">${st.profiles.username}</span>
        `;
        bar.appendChild(div);
      });
    }

    document.getElementById('new-story-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('story-file').files[0];
      if (!file) return;
      const btn = document.getElementById('story-submit-btn');
      btn.textContent = 'Yükleniyor...'; btn.disabled = true;
      try {
        const url = await uploadImage(file, 'stories');
        await sb.from('stories').insert({ user_id: currentUser.id, image_url: url });
        closeModal('story-modal');
        e.target.reset();
        loadStories();
      } catch (err) { alert('Hata: ' + err.message); }
      btn.textContent = 'Hikayeyi Paylaş'; btn.disabled = false;
    });

    function viewStory(story) {
      const viewer = document.getElementById('story-viewer');
      document.getElementById('sv-avatar').src = story.profiles.avatar_url;
      document.getElementById('sv-username').textContent = story.profiles.username;
      document.getElementById('sv-image').src = story.image_url;
      viewer.classList.remove('hidden'); viewer.classList.add('flex');
      const prog = document.getElementById('story-progress');
      prog.style.width = '0%';
      setTimeout(() => { prog.style.width = '100%'; }, 50);
      clearTimeout(storyTimer);
      storyTimer = setTimeout(closeStoryViewer, 5000);
    }

    function closeStoryViewer() {
      clearTimeout(storyTimer);
      document.getElementById('story-viewer').classList.add('hidden');
      document.getElementById('story-viewer').classList.remove('flex');
    }

    async function loadFeed() {
      const { data: posts } = await sb
        .from('posts')
        .select('*, profiles(username, avatar_url), likes(user_id), comments(id)')
        .order('created_at', { ascending: false });

      const feed = document.getElementById('posts-feed');
      feed.innerHTML = '';

      if (!posts || posts.length === 0) {
        feed.innerHTML = '<div class="p-10 text-center text-zinc-500 text-sm">Henüz gönderi yok. İlk gönderiyi sen paylaş!</div>';
        return;
      }

      posts.forEach(post => {
        const isLiked = post.likes.some(l => l.user_id === currentUser.id);
        const article = document.createElement('article');
        article.className = 'pb-4';
        article.innerHTML = `
          <div class="flex items-center justify-between px-3.5 py-2.5">
            <div class="flex items-center gap-2.5">
              <img src="${post.profiles.avatar_url}" class="w-8 h-8 rounded-full object-cover" />
              <span class="font-semibold text-sm">${post.profiles.username}</span>
            </div>
            ${post.user_id === currentUser.id ? `<button onclick="deletePost('${post.id}')" class="text-zinc-500 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
          </div>
          <div class="relative bg-zinc-950 flex items-center justify-center" ondblclick="toggleLike('${post.id}', true)">
            <img src="${post.image_url}" class="w-full max-h-[520px] object-cover" />
          </div>
          <div class="px-3.5 pt-3">
            <div class="flex items-center gap-4 text-2xl mb-2">
              <button onclick="toggleLike('${post.id}')" class="${isLiked ? 'text-rose-500' : 'text-white'} hover:opacity-75 transition">
                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
              </button>
              <button onclick="openComments('${post.id}')" class="hover:opacity-75 transition"><i class="fa-regular fa-comment"></i></button>
            </div>
            <div class="font-semibold text-sm mb-1">${post.likes.length} beğenme</div>
            ${post.caption ? `<div class="text-sm"><span class="font-semibold mr-1.5">${post.profiles.username}</span>${post.caption}</div>` : ''}
            <button onclick="openComments('${post.id}')" class="text-xs text-zinc-500 mt-1 block">${post.comments.length} yorumun tümünü gör</button>
          </div>
        `;
        feed.appendChild(article);
      });
    }

    document.getElementById('new-post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('post-file').files[0];
      const caption = document.getElementById('post-caption').value.trim();
      if (!file) return;
      const btn = document.getElementById('post-submit-btn');
      btn.textContent = 'Paylaşılıyor...'; btn.disabled = true;
      try {
        const url = await uploadImage(file, 'posts');
        await sb.from('posts').insert({ user_id: currentUser.id, image_url: url, caption });
        closeModal('post-modal');
        e.target.reset();
        loadFeed();
      } catch (err) { alert('Hata: ' + err.message); }
      btn.textContent = 'Paylaş'; btn.disabled = false;
    });

    async function deletePost(postId) {
      if (!confirm('Gönderiyi silmek istiyor musun?')) return;
      await sb.from('posts').delete().eq('id', postId);
      loadFeed();
      loadMyProfile();
    }

    async function toggleLike(postId, forceLike = false) {
      const { data: existing } = await sb.from('likes').select('id').eq('post_id', postId).eq('user_id', currentUser.id).maybeSingle();
      if (existing && !forceLike) {
        await sb.from('likes').delete().eq('id', existing.id);
      } else if (!existing) {
        await sb.from('likes').insert({ post_id: postId, user_id: currentUser.id });
      }
      loadFeed();
    }

    async function openComments(postId) {
      activePostIdForComments = postId;
      openModal('comments-modal');
      const { data: comments } = await sb
        .from('comments')
        .select('*, profiles(username, avatar_url)')
        .eq('post_id', postId)
        .order('created_at', { ascending: true });

      const list = document.getElementById('comments-list');
      list.innerHTML = (comments || []).map(c => `
        <div class="flex items-start gap-2.5 text-sm">
          <img src="${c.profiles.avatar_url}" class="w-7 h-7 rounded-full object-cover mt-0.5" />
          <div><span class="font-semibold mr-1.5">${c.profiles.username}</span><span class="text-zinc-300">${c.content}</span></div>
        </div>
      `).join('') || '<div class="text-center text-zinc-500 text-xs py-6">İlk yorumu sen yap!</div>';
    }

    document.getElementById('new-comment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('comment-input');
      const content = input.value.trim();
      if (!content) return;
      input.value = '';
      await sb.from('comments').insert({ post_id: activePostIdForComments, user_id: currentUser.id, content });
      openComments(activePostIdForComments);
      loadFeed();
    });

    async function searchUsers(query) {
      let req = sb.from('profiles').select('*').neq('id', currentUser.id).limit(20);
      if (query) req = req.ilike('username', `%${query}%`);
      const { data: users } = await req;
      const res = document.getElementById('search-results');
      res.innerHTML = (users || []).map(u => `
        <div class="flex items-center justify-between bg-zinc-950 p-3 rounded-xl border border-zinc-900">
          <div class="flex items-center gap-3">
            <img src="${u.avatar_url}" class="w-11 h-11 rounded-full object-cover" />
            <div>
              <div class="font-semibold text-sm">${u.username}</div>
              <div class="text-xs text-zinc-400">${u.full_name || ''}</div>
            </div>
          </div>
          <button onclick='startDM(${JSON.stringify(u)})' class="bg-pink-600 hover:bg-pink-700 text-xs font-semibold px-3.5 py-1.5 rounded-lg">Mesaj At</button>
        </div>
      `).join('');
    }

    async function loadDMUsers() {
      const { data: users } = await sb.from('profiles').select('*').neq('id', currentUser.id);
      const list = document.getElementById('dm-users-list');
      list.innerHTML = (users || []).map(u => `
        <div onclick='startDM(${JSON.stringify(u)})' class="flex items-center gap-3 p-2.5 hover:bg-zinc-900 rounded-xl cursor-pointer transition">
          <img src="${u.avatar_url}" class="w-12 h-12 rounded-full object-cover" />
          <div class="flex-1">
            <div class="font-semibold text-sm">${u.username}</div>
            <div class="text-xs text-zinc-400">Sohbeti açmak için dokun</div>
          </div>
          <i class="fa-regular fa-paper-plane text-zinc-500"></i>
        </div>
      `).join('') || '<div class="text-zinc-500 text-sm">Henüz başka kullanıcı kayıt olmamış.</div>';
    }

    async function startDM(user) {
      activeChatUser = user;
      switchTab('dm');
      document.getElementById('dm-badge').classList.add('hidden');
      document.getElementById('dm-list-view').classList.add('hidden');
      document.getElementById('dm-chat-view').classList.remove('hidden');
      document.getElementById('dm-chat-view').classList.add('flex');
      document.getElementById('chat-user-avatar').src = user.avatar_url;
      document.getElementById('chat-user-name').textContent = user.username;
      loadMessages();
    }

    function closeChat() {
      activeChatUser = null;
      document.getElementById('dm-chat-view').classList.add('hidden');
      document.getElementById('dm-chat-view').classList.remove('flex');
      document.getElementById('dm-list-view').classList.remove('hidden');
    }

    async function loadMessages() {
      if (!activeChatUser) return;
      const { data: msgs } = await sb
        .from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChatUser.id}),and(sender_id.eq.${activeChatUser.id},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      const box = document.getElementById('chat-messages');
      box.innerHTML = (msgs || []).map(m => {
        const isMine = m.sender_id === currentUser.id;
        return `
          <div class="max-w-[75%] px-3.5 py-2 rounded-2xl text-sm ${isMine ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white self-end rounded-br-sm' : 'bg-zinc-900 text-zinc-100 self-start rounded-bl-sm'}">
            ${m.content}
          </div>
        `;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content || !activeChatUser) return;
      input.value = '';
      await sb.from('messages').insert({ sender_id: currentUser.id, receiver_id: activeChatUser.id, content });
      loadMessages();
    });

    function subscribeRealtime() {
      sb.channel('amorgram-realtime')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          const msg = payload.new;
          if (msg.receiver_id === currentUser.id || msg.sender_id === currentUser.id) {
            if (activeChatUser && (msg.sender_id === activeChatUser.id || msg.receiver_id === activeChatUser.id)) {
              loadMessages();
            } else if (msg.receiver_id === currentUser.id) {
              document.getElementById('dm-badge').classList.remove('hidden');
            }
          }
        })
        .subscribe();
    }

    async function loadMyProfile() {
      const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
      currentProfile = profile || currentProfile;
      document.getElementById('prof-header-username').textContent = currentProfile.username;
      document.getElementById('prof-avatar').src = currentProfile.avatar_url;
      document.getElementById('nav-avatar').src = currentProfile.avatar_url;
      document.getElementById('prof-fullname').textContent = currentProfile.full_name;
      document.getElementById('prof-bio').textContent = currentProfile.bio;

      const { data: myPosts } = await sb.from('posts').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
      document.getElementById('prof-post-count').textContent = (myPosts || []).length;
      document.getElementById('prof-posts-grid').innerHTML = (myPosts || []).map(p => `
        <div class="aspect-square bg-zinc-900 overflow-hidden"><img src="${p.image_url}" class="w-full h-full object-cover" /></div>
      `).join('');
    }

    function openEditProfile() {
      document.getElementById('edit-fullname').value = currentProfile.full_name || '';
      document.getElementById('edit-bio').value = currentProfile.bio || '';
      openModal('edit-profile-modal');
    }

    document.getElementById('edit-profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      let avatarUrl = currentProfile.avatar_url;
      const file = document.getElementById('edit-avatar-file').files[0];
      if (file) avatarUrl = await uploadImage(file, 'avatars');

      await sb.from('profiles').update({
        full_name: document.getElementById('edit-fullname').value.trim(),
        bio: document.getElementById('edit-bio').value.trim(),
        avatar_url: avatarUrl
      }).eq('id', currentUser.id);

      closeModal('edit-profile-modal');
      loadMyProfile();
    });

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
  </script>
</body>
</html>
